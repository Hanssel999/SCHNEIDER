services:
    db:
        image: postgres:17.5
        container_name: postgres_container
        restart: unless-stopped

        environment:
            POSTGRES_DB: schneider
            POSTGRES_USER: imonstar
            POSTGRES_PASSWORD: Minor123!@#123

        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U imonstar -d schneider"]
            interval: 5s
            timeout: 5s
            retries: 5
volumes:
    postgres_data:
